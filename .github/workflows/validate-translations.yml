# .github/workflows/validate-translations.yml

name: Validate translations

on:
pull_request:
paths:
- "langs/**/*.json"
- ".github/workflows/validate-translations.yml"

jobs:
validate:
name: Validate language files
runs-on: ubuntu-latest


steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Validate JSON syntax
    run: |
      for file in langs/*.json; do
        echo "Checking JSON syntax: $file"
        jq empty "$file"
      done

  - name: Check missing translation keys
    run: |
      python3 .github/scripts/check_translation_keys.py
